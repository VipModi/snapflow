<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapFlow</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <img src="../../icons/icon32.png" alt="SnapFlow Logo" class="brand-icon">
        <h1 class="brand-title">SnapFlow</h1>
      </div>
      <button id="btnOpenManagement" class="icon-button" title="Open Library & Settings" aria-label="Open Library and Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <!-- Feedback Banner -->
    <div id="statusBanner" class="status-banner hidden" role="status" aria-live="polite">
      <span id="statusIcon" class="status-icon"></span>
      <span id="statusMessage" class="status-message"></span>
    </div>

    <!-- Main Content -->
    <main class="popup-main">
      <!-- Section: Screenshot -->
      <section class="section">
        <div class="section-header">
          <h2 class="section-title">Screenshot</h2>
          <span class="badge badge-active">Ready</span>
        </div>

        <div class="action-grid">
          <!-- Primary Action: Viewport Capture -->
          <button id="btnCaptureViewport" class="btn btn-primary" aria-label="Capture visible viewport">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
              <circle cx="12" cy="13" r="4"></circle>
            </svg>
            <div class="btn-text">
              <span class="btn-main">Capture Visible Tab</span>
              <span class="btn-sub">Downloads PNG directly</span>
            </div>
            <kbd class="shortcut-key">Ctrl+Shift+S</kbd>
          </button>

          <!-- Clipboard Copy Action -->
          <button id="btnCopyClipboard" class="btn btn-secondary" aria-label="Copy visible viewport to clipboard">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span>Copy Tab to Clipboard</span>
          </button>
        </div>

        <!-- Format Selector -->
        <div class="format-row">
          <span class="format-label">Image Format:</span>
          <div class="format-options">
            <label class="radio-label">
              <input type="radio" name="formatOption" value="png" checked>
              <span>PNG</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="formatOption" value="jpeg">
              <span>JPEG</span>
            </label>
          </div>
        </div>

        <!-- Secondary Screenshot Modes (Upcoming) -->
        <div class="upcoming-row">
          <button class="btn btn-disabled" disabled title="Coming in next increment">
            <span>Full-Page</span>
          </button>
          <button class="btn btn-disabled" disabled title="Coming in next increment">
            <span>Selected Region</span>
          </button>
        </div>
      </section>

      <!-- Section: Video & Screen Recording (Phase 3) -->
      <section class="section section-dimmed">
        <div class="section-header">
          <h2 class="section-title">Screen Recording</h2>
          <span class="badge badge-queued">Phase 3</span>
        </div>
        <p class="section-note">Tab, window and desktop screen recording engine in development.</p>
      </section>
    </main>

    <!-- Footer -->
    <footer class="popup-footer">
      <button id="btnViewLibrary" class="link-button">View Capture Library</button>
      <span class="version-tag">v0.1.0 • 100% Local</span>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
